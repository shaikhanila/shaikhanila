<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Skill levels">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e75b2"/>
      <stop offset="100%" stop-color="#c3a6ff"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #c9d1d9; }
      .track { fill: #21262d; }
      .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: fill 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
      .pct { font-size: 13px; fill: #8b949e; opacity: 0; animation: show 0.6s ease-out forwards; }
      @keyframes fill { to { transform: scaleX(1); } }
      @keyframes show { to { opacity: 1; } }
    </style>
  </defs>
  <rect width="700" height="300" rx="14" fill="#0d1117"/>

  <!-- Python 80% -->
  <text x="24" y="47">Python</text>
  <rect class="track" x="190" y="32" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="32" width="320" height="14" rx="7" fill="url(#fill)" style="animation-delay:0.1s"/>
  <text class="pct" x="602" y="45" style="animation-delay:1.2s">80%</text>

  <!-- SQL 80% -->
  <text x="24" y="92">SQL</text>
  <rect class="track" x="190" y="77" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="77" width="320" height="14" rx="7" fill="url(#fill)" style="animation-delay:0.3s"/>
  <text class="pct" x="602" y="90" style="animation-delay:1.4s">80%</text>

  <!-- Power BI 80% -->
  <text x="24" y="137">Power BI &amp; DAX</text>
  <rect class="track" x="190" y="122" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="122" width="320" height="14" rx="7" fill="url(#fill)" style="animation-delay:0.5s"/>
  <text class="pct" x="602" y="135" style="animation-delay:1.6s">80%</text>

  <!-- EDA 80% -->
  <text x="24" y="182">EDA &amp; Visualization</text>
  <rect class="track" x="190" y="167" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="167" width="320" height="14" rx="7" fill="url(#fill)" style="animation-delay:0.7s"/>
  <text class="pct" x="602" y="180" style="animation-delay:1.8s">80%</text>

  <!-- ML 60% -->
  <text x="24" y="227">Machine Learning</text>
  <rect class="track" x="190" y="212" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="212" width="240" height="14" rx="7" fill="url(#fill2)" style="animation-delay:0.9s"/>
  <text class="pct" x="602" y="225" style="animation-delay:2.0s">60%</text>

  <!-- GenAI 40% -->
  <text x="24" y="272">GenAI</text>
  <rect class="track" x="190" y="257" width="400" height="14" rx="7"/>
  <rect class="bar" x="190" y="257" width="160" height="14" rx="7" fill="url(#fill2)" style="animation-delay:1.1s"/>
  <text class="pct" x="602" y="270" style="animation-delay:2.2s">40%</text>
</svg>
