<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Anila Shaikh, Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1b3a6b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d4a900"/>
      <stop offset="100%" stop-color="#f2c811"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ecbff"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .grid { stroke: #ffffff; stroke-opacity: 0.06; stroke-width: 1; }
      .title { font-size: 54px; font-weight: 700; fill: url(#name); opacity: 0; animation: rise 1.2s ease-out 0.2s forwards; }
      .sub { font-size: 21px; fill: #9ecbff; opacity: 0; animation: rise 1.2s ease-out 0.8s forwards; }
      .tag { font-size: 16px; fill: #8b949e; font-style: italic; opacity: 0; animation: rise 1.2s ease-out 1.4s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

      .b { transform-box: fill-box; transform-origin: bottom; animation: grow 7s ease-in-out infinite; }
      .b1 { animation-delay: 0.0s; } .b2 { animation-delay: 0.15s; } .b3 { animation-delay: 0.3s; }
      .b4 { animation-delay: 0.45s; } .b5 { animation-delay: 0.6s; } .b6 { animation-delay: 0.75s; } .b7 { animation-delay: 0.9s; }
      @keyframes grow {
        0%   { transform: scaleY(0); }
        18%  { transform: scaleY(1); }
        88%  { transform: scaleY(1); }
        100% { transform: scaleY(0); }
      }

      .line { fill: none; stroke: #3fb950; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
              stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 7s ease-in-out infinite; }
      @keyframes draw {
        0%, 12% { stroke-dashoffset: 100; }
        35%, 88% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      .dot { fill: #3fb950; opacity: 0; animation: dotpop 7s ease-in-out infinite; }
      @keyframes dotpop { 0%, 30% { opacity: 0; } 40%, 88% { opacity: 1; } 100% { opacity: 0; } }

      .code { font-family: 'Courier New', monospace; font-size: 13px; fill: #58a6ff; opacity: 0; animation: float 9s ease-in-out infinite; }
      @keyframes float {
        0%   { opacity: 0; transform: translateY(12px); }
        20%  { opacity: 0.55; }
        70%  { opacity: 0.55; }
        100% { opacity: 0; transform: translateY(-22px); }
      }
      .pulse { fill: #f2c811; animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- grid -->
  <g>
    <line class="grid" x1="0" y1="60"  x2="900" y2="60"/>
    <line class="grid" x1="0" y1="120" x2="900" y2="120"/>
    <line class="grid" x1="0" y1="180" x2="900" y2="180"/>
    <line class="grid" x1="0" y1="230" x2="900" y2="230"/>
  </g>

  <!-- floating code snippets -->
  <text class="code" x="60"  y="235" style="animation-delay:0s">SELECT insight</text>
  <text class="code" x="230" y="235" style="animation-delay:2.2s">df.groupby('segment')</text>
  <text class="code" x="440" y="235" style="animation-delay:4.4s">Revenue = SUM( )</text>
  <text class="code" x="120" y="40"  style="animation-delay:1.1s">WITH cohort AS (...)</text>
  <text class="code" x="380" y="36"  style="animation-delay:3.3s">model.fit(X, y)</text>

  <!-- title block -->
  <text class="title" x="60" y="115">Anila Shaikh</text>
  <text class="sub"   x="62" y="155">Data Analyst  ·  MSc Mathematics, IIT Delhi</text>
  <text class="tag"   x="62" y="188">I turn messy rows into decisions.</text>
  <circle class="pulse" cx="68" cy="208" r="5"/>
  <text x="82" y="213" font-size="14" fill="#3fb950" style="font-size:14px">open to work</text>

  <!-- animated chart -->
  <g>
    <rect class="b b1" x="590" y="170" width="24" height="40"  rx="4" fill="url(#bar)"/>
    <rect class="b b2" x="628" y="150" width="24" height="60"  rx="4" fill="url(#bar2)"/>
    <rect class="b b3" x="666" y="160" width="24" height="50"  rx="4" fill="url(#bar)"/>
    <rect class="b b4" x="704" y="120" width="24" height="90"  rx="4" fill="url(#bar2)"/>
    <rect class="b b5" x="742" y="135" width="24" height="75"  rx="4" fill="url(#bar)"/>
    <rect class="b b6" x="780" y="95"  width="24" height="115" rx="4" fill="url(#bar2)"/>
    <rect class="b b7" x="818" y="65"  width="24" height="145" rx="4" fill="url(#bar)"/>

    <path class="line" pathLength="100" d="M602,150 L640,128 L678,138 L716,98 L754,112 L792,72 L830,44"/>
    <circle class="dot" cx="602" cy="150" r="5"/>
    <circle class="dot" cx="640" cy="128" r="5"/>
    <circle class="dot" cx="678" cy="138" r="5"/>
    <circle class="dot" cx="716" cy="98"  r="5"/>
    <circle class="dot" cx="754" cy="112" r="5"/>
    <circle class="dot" cx="792" cy="72"  r="5"/>
    <circle class="dot" cx="830" cy="44"  r="5"/>
    <line x1="575" y1="210" x2="860" y2="210" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
